<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mind Reset</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(180deg, #063f3d, #0e615d);
            color: white;
            text-align: center;
        }

        #header {
            padding: 18px;
        }

        h2 {
            margin: 4px;
        }

        #gameArea {
            position: relative;
            width: 100%;
            height: 72vh;
        }

        #orb {
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #b2dfdb;
            box-shadow: 0 0 25px rgba(178,223,219,0.8);
            cursor: pointer;
            transition: 0.15s;
        }

        #score {
            font-size: 20px;
            margin-top: 8px;
        }

        #message {
            color: #b2dfdb;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div id="header">
    <h2>Mind Reset</h2>
    <div id="message">
        Tap the moving orb and focus on one thing at a time.
    </div>

    <div id="score">
        Score: <span id="scoreValue">0</span>
    </div>
</div>

<div id="gameArea">
    <div id="orb"></div>
</div>

<script>

    let score = 0;

    const orb =
        document.getElementById("orb");

    const gameArea =
        document.getElementById("gameArea");

    const scoreValue =
        document.getElementById("scoreValue");

    function moveOrb() {

        const maxX =
            gameArea.clientWidth - orb.clientWidth;

        const maxY =
            gameArea.clientHeight - orb.clientHeight;

        const x =
            Math.random() * maxX;

        const y =
            Math.random() * maxY;

        orb.style.left = x + "px";
        orb.style.top = y + "px";
    }

    orb.addEventListener("click", function () {

        score++;

        scoreValue.textContent = score;

        orb.style.transform = "scale(0.8)";

        setTimeout(function () {
            orb.style.transform = "scale(1)";
        }, 100);

        moveOrb();
    });

    window.addEventListener(
        "load",
        moveOrb
    );

</script>

</body>
</html>
